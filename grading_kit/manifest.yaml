# grading_kit/manifest.yaml — the SINGLE entry point a grader reads.
# You fill this in. It declares the THREE axes and points to everything
# needed to reproduce, evaluate, and grade the project. A grader opens
# ONLY this file; it points to the rest. Build/run scripts and the eval
# tasks are NAMED here, not copied, so they never go stale.

project_id: "12"

axes:
  domain: "Land Registry Archives & Legal Aid"
  data_speciality: "bangla-english-codeswitch-handwritten"   # cursive Bangla HTR + inline English/Bangla-numeral code-switching
  primary_nfr: "precision-first"
  nfr_target: "answer-F1 >= 0.92 and critical-field Exact Match >= 95% (plot no., deed amount, dates, party names)"

corpus:
  path: data/raw/                   # where the scanned page-images live
  pages: 546                        # 653 raw - 2 non-content (dolil_30, dolil_412) - 105 confirmed duplicate re-scans (still on disk, excluded from data/deed_groups.csv). The earlier 609 (44 wrongly flagged as thumbnail/corrupt) was a bug, fixed in notebooks/eda.ipynb.
  words: 65500                      # conservative estimate: 546 DISTINCT pages x 120 words/page; 5 hand-counted pages ran 259-447 words each, so 120 is a floor not a typical value. Clears the >=60,000 floor by a narrow ~9% margin (corrected from an earlier 78000 estimate that double-counted duplicate pages). See data/provenance.md.
  provenance: data/provenance.md    # source + licence + counts

heldout:
  pages_dir: grading_kit/heldout_pages/   # page-images set aside, never OCR-trained on
  labels:    grading_kit/labels.jsonl     # ground-truth transcriptions for those pages (currently DRAFT/NEEDS-REVIEW — pending native Bangla-reader verification)

entrypoints:                          # named, not duplicated (they build/run the real code)
  build_index: scripts/build_index.sh
  run_query:   scripts/run.sh
  eval_tasks:  grading_kit/tasks.jsonl      # authored in A3
  checker:     grading_kit/success_check.py
  trace:       traces/run.jsonl              # JSONL trajectory the A3 agentic-feature check reads
