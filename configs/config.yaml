# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cpu

# Stage 1 preprocess — classical deskew/denoise/binarize (design_choices.md Row 1).
# skew_range/step: projection-profile search window. sauvola_*: local adaptive threshold
# for the binary copy (window/k/r per Sauvola 2000). quality_*: high-pass blur-variance
# legibility proxy; pages scoring below quality_threshold are flagged low_legibility in
# the sidecar, not dropped -- Stage 3 decides what to do with a flagged page, not this one.
preprocess: {skew_range_deg: 4.0, skew_step_deg: 0.5, sauvola_window: 15, sauvola_k: 0.2, sauvola_r: 128.0, quality_blur_radius: 3, quality_norm: 40.0, quality_threshold: 0.35, out_dir: "data/interim/preprocessed"}
enhance:   {enabled: false, model: "none", type: "none"}   # or "vae" / "none"
# Stage 2 layout — training-free projection heuristic (docs Step 0 decision D1).
# NOT because the corpus lacks tables: it has them (dolil_74 is a 4-column তফসিল; >=3.5% of
# 653 pages show a column gutter). Justified instead by D2 reading whole pages in one VLM
# call, so layout only governs cropping. See vision/layout.py docstring for the measurement.
# min_ink_frac: fraction of a row that must be ink for it to count as a text row.
# line_gap_px: blank rows below this merge lines into one block; above it splits blocks.
layout:    {model: "projection-heuristic", score_thr: 0.5, min_ink_frac: 0.01, line_gap_px: 18, min_height_px: 10, min_width_px: 30, pad_px: 4}
# Stage 3 OCR/HTR — single-pass VLM per region (Step 0 decision D2).
# sidecar/pages_dir/deed_groups: where page images and page->deed mapping come from, since a
# Region carries only page_id. allow_page_as_doc: emergency standalone mode, leaks by design.
# ascii_digits: map Bangla numerals to ASCII (A1 form commits to this for Exact Match).
ocr:       {model: "Qwen/Qwen2.5-VL-3B-Instruct", finetune: false, sidecar: "data/interim/preprocessed/preprocess.jsonl", pages_dir: "data/raw", deed_groups: "data/deed_groups.csv", allow_page_as_doc: false, ascii_digits: true, max_new_tokens: 768}    # BASELINE = pretrained OCR
embed:     {model: "intfloat/multilingual-e5-small", dimension: 384, max_model_tokens: 512, device: "cpu", dtype: "float32", cache_dir: ".hf_cache", document_prefix: "passage: ", query_prefix: "query: ", normalize_embeddings: true, initial_batch_size: 8}
index:     {type: "faiss:flat", path: "data/interim/index", merge_below_tokens: 80, target_min_tokens: 200, target_max_tokens: 300, preferred_max_tokens: 350, hard_max_tokens: 450, chunk_tokens: 450, overlap: 40, sparse_schema_version: 1}
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, candidate_multiplier: 4, dense_weight: 0.65, bm25_weight: 0.35, rrf_k: 60, bm25_enabled: true, bm25_token_field: "bm25_tokens", bm25_cache: true, bm25_cache_name: "bm25", bm25_k1: 1.5, bm25_b: 0.75, bm25_epsilon: 0.25, rerank: true, reranker: "BAAI/bge-reranker-v2-m3", rerank_top_n: 30, rerank_max_length: 512, reranker_trust_remote_code: false}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
